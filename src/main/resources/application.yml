spring:
  redis:
    uri: ${REDIS_URI}
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: journaldb
      auto-index-creation: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: myjournalapp.dev@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /journal

weather:
  api:
    key: ${WEATHER_API_KEY}

logging:
  level:
    org:
      springframework:
        security: DEBUG
jwt:
  secret: ${JWT_SECRET}
kafka:
  enabled: ${KAFKA_ENABLED:false}
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
